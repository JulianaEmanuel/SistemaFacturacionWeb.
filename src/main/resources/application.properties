spring.application.name=sistemaweb
server.port=8080
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.profiles.default=nodb
app.sqlserver.trust-server-certificate=false
app.security.admin-type=${ADMIN_TYPE:ADMINISTRADOR}
server.servlet.session.timeout=20m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
# Evitar que el diagnóstico de SQL o parámetros exponga credenciales.
logging.level.org.springframework.jdbc.core=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.org.springframework.security=INFO
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
spring.mvc.log-request-details=false
# Fotografias locales, fuera de recursos publicos y de Git. No requiere cambios SQL.
app.perfil.fotos-dir=${PROFILE_PHOTO_DIR:data/perfiles}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
