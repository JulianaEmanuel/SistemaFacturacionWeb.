<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clientes | Sistema de Facturación Web')}"></head>
<body class="dashboard-page management-page">
	<div class="app-shell">
		<aside th:replace="~{fragments/sidebar :: sidebar('clientes')}"></aside>
		<div class="app-main">
			<header th:replace="~{fragments/topbar :: topbar('Clientes', 'GESTIÓN')}"></header>
			<main class="content-area">
				<section class="page-intro" aria-labelledby="clientes-title">
					<p class="eyebrow">DIRECTORIO</p>
					<h2 id="clientes-title">Gestión de clientes</h2>
					<p class="intro-copy">Personas registradas en el sistema.</p>
				</section>
				<div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div>
				<div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
				<section class="cliente-panel" aria-label="Listado de clientes">
					<div class="cliente-toolbar">
						<form class="cliente-search" method="get" th:action="@{/modulos/clientes}">
							<label class="visually-hidden" for="cliente-search">Buscar personas</label>
							<div class="search-input-wrap"><i class="bi bi-search" aria-hidden="true"></i><input id="cliente-search" class="form-control" type="search" name="q" th:value="${filtro}" placeholder="Buscar por cédula o nombre"></div>
							<button class="btn btn-outline-success" type="submit">Buscar</button>
							<a class="btn btn-outline-secondary" th:href="@{/modulos/clientes}">Limpiar</a>
						</form>
						<a class="btn btn-success cliente-create" th:href="@{/modulos/clientes/nuevo}"><i class="bi bi-plus-lg" aria-hidden="true"></i> Registrar cliente</a>
					</div>
					<div class="table-responsive">
						<table class="management-table table invoice-table cliente-table align-middle mb-0">
							<colgroup><col class="col-cedula"><col class="col-nombres"><col class="col-apellidos"><col class="col-fecha"><col class="col-acciones"></colgroup>
							<thead><tr><th scope="col">Cédula</th><th scope="col">Nombres</th><th scope="col">Apellidos</th><th scope="col">Fecha de nacimiento</th><th scope="col">Contacto</th><th scope="col" class="text-end">Acciones</th></tr></thead>
							<tbody>
								<tr th:each="cliente : ${clientes}">
									<td data-label="Cédula" th:text="${#strings.trim(cliente.cedulaPersona)}"></td>
									<td data-label="Nombres" th:text="${#strings.trim(cliente.nombresPersona)}"></td>
									<td data-label="Apellidos" th:text="${#strings.trim(cliente.apellidosPersona)}"></td>
									<td data-label="Fecha de nacimiento" th:text="${cliente.fechaNacimientoPersona == null ? '-' : #temporals.format(cliente.fechaNacimientoPersona, 'dd/MM/yyyy')}"></td>
									<td data-label="Contacto"><div th:text="${cliente.direccionPersona ?: '—'}"></div><div th:text="${cliente.correoPersona ?: '—'}"></div><small th:text="${cliente.telefonoPersona ?: ''}"></small></td><td data-label="Acciones" class="text-end cliente-actions">
										<a th:if="${administracionDisponible}" class="btn btn-sm btn-outline-success" th:href="@{/modulos/clientes/{id}/editar(id=${cliente.idPersona})}" th:aria-label="|Editar ${#strings.trim(cliente.nombresPersona)}|"><i class="bi bi-pencil" aria-hidden="true"></i><span>Editar</span></a>
										<form th:if="${administracionDisponible}" class="d-inline" method="post" th:action="@{/modulos/clientes/{id}/eliminar(id=${cliente.idPersona})}" onsubmit="return confirm('¿Eliminar esta persona? No se eliminará si tiene relaciones con facturas, empleados o proveedores.')">
											<button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash" aria-hidden="true"></i><span>Eliminar</span></button>
										</form>
									</td>
								</tr>
								<tr th:if="${#lists.isEmpty(clientes)}"><td class="empty-invoices" colspan="6">No hay personas que coincidan con la búsqueda.</td></tr>
							</tbody>
						</table>
					</div>
				</section>
			</main>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/js/app.js}"></script>
</body>
</html>
