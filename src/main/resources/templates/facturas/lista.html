<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Facturas | Sistema de Facturación Web')}"></head>
<body class="dashboard-page management-page"><div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar('facturas')}"></aside><div class="app-main"><header th:replace="~{fragments/topbar :: topbar('Facturas', 'GESTIÓN')}"></header>
<main class="content-area"><section class="page-intro"><p class="eyebrow">DOCUMENTOS</p><h2>Gestión de facturas</h2><p>Consulta los documentos emitidos según los permisos de tu cuenta.</p></section>
<div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
<section class="cliente-panel"><div class="cliente-toolbar"><form class="d-flex flex-wrap gap-2 align-items-end" method="get" th:action="@{/modulos/facturas}">
<div><label class="form-label" for="q">Número, cédula o nombre del cliente</label><input class="form-control" type="search" id="q" name="q" maxlength="100" th:value="${filtro}"></div>
<div><label class="form-label" for="desde">Desde</label><input class="form-control" type="date" id="desde" name="desde" min="1753-01-01" max="9999-12-30" th:value="${desde}"></div>
<div><label class="form-label" for="hasta">Hasta</label><input class="form-control" type="date" id="hasta" name="hasta" min="1753-01-01" max="9999-12-30" th:value="${hasta}"></div>
<button class="btn btn-outline-success">Buscar</button><a class="btn btn-outline-secondary" th:href="@{/modulos/facturas}">Limpiar</a></form><a class="btn btn-success cliente-create" th:href="@{/modulos/facturas/nuevo}">Registrar factura</a></div>
<div class="table-responsive"><table class="management-table table invoice-table align-middle mb-0"><thead><tr><th>Número</th><th>Fecha</th><th>Cliente</th><th>Empleado</th><th>Subtotal</th><th>IVA</th><th>Forma de pago</th><th>Total</th><th>Acciones</th></tr></thead><tbody>
<tr th:each="f : ${facturas.content}"><td th:text="${f.id}" data-label="Número"></td><td th:text="${#temporals.format(f.fecha,'dd/MM/yyyy HH:mm')}" data-label="Fecha"></td><td data-label="Cliente"><span th:text="${f.cliente}"></span><small class="d-block" th:text="${f.cedula}"></small></td><td th:text="${f.empleado}" data-label="Empleado"></td><td th:text="${f.subtotalVisible()}" data-label="Subtotal"></td><td th:text="${f.ivaVisible()}" data-label="IVA"></td><td data-label="Forma de pago" th:text="${f.pago == null ? 'No registrada' : f.pago.nombre}"></td><td th:text="${f.totalVisible()}" data-label="Total"></td><td data-label="Acciones"><a class="btn btn-sm btn-outline-success" th:href="@{/modulos/facturas/{id}(id=${f.id})}">Ver detalle</a></td></tr>
<tr th:if="${facturas.empty}"><td colspan="9" class="empty-invoices">No hay facturas que coincidan con la búsqueda.</td></tr></tbody></table></div>
<nav class="d-flex flex-wrap gap-3 justify-content-between align-items-center p-3" aria-label="Paginación"><span th:text="|${facturas.totalElements} facturas · Página ${facturas.number + 1} de ${facturas.totalPages == 0 ? 1 : facturas.totalPages}|"></span><div class="d-flex gap-2"><a th:if="${facturas.hasPrevious()}" class="btn btn-outline-success" th:href="@{/modulos/facturas(q=${filtro},desde=${desde},hasta=${hasta},pagina=${facturas.number - 1})}">Anterior</a><a th:if="${facturas.hasNext()}" class="btn btn-outline-success" th:href="@{/modulos/facturas(q=${filtro},desde=${desde},hasta=${hasta},pagina=${facturas.number + 1})}">Siguiente</a></div></nav></section></main>
</div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/app.js}"></script></body></html>
