<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${moduleName} + ' | Sistema de Facturación Web')}"></head>
<body class="dashboard-page management-page">
	<div class="app-shell">
		<aside th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></aside>
		<div class="app-main">
			<header th:replace="~{fragments/topbar :: topbar(${moduleName}, 'MÓDULOS')}"></header>
			<main class="content-area">
				<section class="page-intro" aria-labelledby="module-title">
					<p class="eyebrow">ÁREA DE TRABAJO</p>
					<h2 id="module-title" th:text="${moduleName}">Módulo</h2>
					<p class="intro-copy">Consulta y administra la información de esta área desde un espacio de trabajo unificado.</p>
				</section>
				<section class="module-workspace" aria-label="Contenido del módulo">
					<div class="module-workspace-heading">
						<span class="workspace-icon"><i class="bi bi-layout-text-window-reverse" aria-hidden="true"></i></span>
						<div><strong th:text="${moduleName}">Módulo</strong><small>Área de trabajo</small></div>
					</div>
					<div class="module-empty-state">
						<span class="empty-state-icon"><i class="bi bi-inbox" aria-hidden="true"></i></span>
						<strong>Sin datos disponibles</strong>
						<small>El contenido se mostrará cuando este módulo tenga información conectada.</small>
					</div>
				</section>
			</main>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/js/app.js}"></script>
</body>
</html>
