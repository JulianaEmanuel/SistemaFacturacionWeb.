<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Proveedores | Sistema de Facturación Web')}"></head>
<body class="dashboard-page management-page">
	<div class="app-shell">
		<aside th:replace="~{fragments/sidebar :: sidebar('proveedores')}"></aside>
		<div class="app-main">
			<header th:replace="~{fragments/topbar :: topbar('Proveedores', 'GESTIÓN')}"></header>
			<main class="content-area">
				<section class="page-intro" aria-labelledby="proveedores-title">
					<p class="eyebrow">DIRECTORIO</p>
					<h2 id="proveedores-title">Gestión de proveedores</h2>
					<p class="intro-copy">Proveedores y personas asociadas registradas en el sistema.</p>
				</section>
				<div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div>
				<div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
				<section class="cliente-panel proveedor-panel" aria-label="Listado de proveedores">
					<div class="cliente-toolbar proveedor-toolbar">
						<form class="cliente-search" method="get" th:action="@{/modulos/proveedores}">
							<label class="visually-hidden" for="proveedor-search">Buscar proveedores</label>
							<div class="search-input-wrap"><i class="bi bi-search" aria-hidden="true"></i><input id="proveedor-search" class="form-control" type="search" name="q" th:value="${filtro}" placeholder="Buscar por cédula, nombres o apellidos"></div>
							<button class="btn btn-outline-success" type="submit">Buscar</button>
							<a class="btn btn-outline-secondary" th:href="@{/modulos/proveedores}">Limpiar</a>
						</form>
						<a th:if="${administracionDisponible}" class="btn btn-success cliente-create" th:href="@{/modulos/proveedores/nuevo}"><i class="bi bi-plus-lg" aria-hidden="true"></i> Registrar proveedor</a>
					</div>
					<div class="table-responsive">
						<table class="management-table table invoice-table cliente-table proveedor-table align-middle mb-0">
							<colgroup><col class="proveedor-col-id"><col class="proveedor-col-cedula"><col class="proveedor-col-nombres"><col class="proveedor-col-apellidos"><col class="proveedor-col-email"><col class="proveedor-col-acciones"></colgroup>
							<thead><tr><th scope="col">ID</th><th scope="col">Cédula</th><th scope="col">Nombres</th><th scope="col">Apellidos</th><th scope="col">Correo</th><th scope="col" class="text-end">Acciones</th></tr></thead>
							<tbody>
								<tr th:each="proveedor : ${proveedores}">
									<td data-label="ID" th:text="${proveedor.idProveedor}"></td>
									<td data-label="Cédula" th:text="${#strings.trim(proveedor.persona.cedulaPersona)}"></td>
									<td data-label="Nombres" th:text="${#strings.trim(proveedor.persona.nombresPersona)}"></td>
									<td data-label="Apellidos" th:text="${#strings.trim(proveedor.persona.apellidosPersona)}"></td>
									<td data-label="Correo" th:text="${proveedor.email == null or #strings.isEmpty(#strings.trim(proveedor.email)) ? '-' : #strings.trim(proveedor.email)}"></td>
									<td data-label="Acciones" class="text-end cliente-actions">
										<a th:if="${administracionDisponible}" class="btn btn-sm btn-outline-success" th:href="@{/modulos/proveedores/{id}/editar(id=${proveedor.idProveedor})}" th:aria-label="|Editar proveedor ${proveedor.idProveedor}|"><i class="bi bi-pencil" aria-hidden="true"></i><span>Editar</span></a>
										<form th:if="${administracionDisponible}" class="d-inline" method="post" th:action="@{/modulos/proveedores/{id}/eliminar(id=${proveedor.idProveedor})}" onsubmit="return confirm('¿Eliminar este proveedor? No se eliminará si tiene productos asociados ni se borrará la persona relacionada.')">
											<button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash" aria-hidden="true"></i><span>Eliminar</span></button>
										</form>
									</td>
								</tr>
								<tr th:if="${#lists.isEmpty(proveedores)}"><td class="empty-invoices" colspan="6">No hay proveedores que coincidan con la búsqueda.</td></tr>
							</tbody>
						</table>
					</div>
				</section>
			</main>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/js/app.js}"></script>
</body>
</html>
