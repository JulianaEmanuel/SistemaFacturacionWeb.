<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Verificar correo | Sistema de Facturación Web')}"></head>
<body class="login-page">
<button class="theme-toggle login-theme-toggle" type="button" data-theme-toggle hidden aria-label="Activar modo oscuro" aria-pressed="false" title="Activar modo oscuro"><i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i></button>
<main class="login-stage">
    <div class="login-orb orb-one" aria-hidden="true"></div><div class="login-orb orb-two" aria-hidden="true"></div><div class="login-grid" aria-hidden="true"></div>
    <a class="login-brand" th:href="@{/}" aria-label="Sistema de Facturación Web">
        <span class="portal-logo" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M9 5h14v23l-3-2-4 2-4-2-3 2V5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M13 11h6m-6 5h6m-6 5h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
        <span>Sistema de Facturación <strong>Web</strong></span>
    </a>
    <section class="login-card" aria-labelledby="email-title">
        <div class="login-card-symbol"><i class="bi bi-envelope-check" aria-hidden="true"></i></div>
        <p class="portal-eyebrow">SEGURIDAD DE LA CUENTA</p>
        <h1 id="email-title">Verifica tu correo</h1>
        <p class="login-description">El correo se asociará a tu cuenta únicamente después de confirmar el enlace enviado a esa dirección.</p>
        <div th:if="${mensaje}" class="portal-message message-success" role="status" th:text="${mensaje}"></div>
        <form method="post" th:action="@{/cuenta/correo}" class="login-form">
            <label for="email">Correo electrónico</label>
            <div class="login-input"><i class="bi bi-envelope" aria-hidden="true"></i><input id="email" name="email" type="email" maxlength="254" autocomplete="email" placeholder="tu-correo@ejemplo.com" required></div>
            <button class="portal-primary login-submit" type="submit">Enviar verificación <i class="bi bi-arrow-right" aria-hidden="true"></i></button>
        </form>
        <p class="login-security"><i class="bi bi-lock-fill" aria-hidden="true"></i> Solo puedes modificar el correo de tu propia cuenta</p>
    </section>
    <a class="login-footer" th:href="@{/}">Volver al sistema</a>
</main>
<script th:src="@{/js/login.js}"></script>
</body></html>
