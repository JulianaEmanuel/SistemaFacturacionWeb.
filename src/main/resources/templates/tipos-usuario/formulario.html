<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Tipo de usuario | Sistema de Facturación Web')}"></head>
<body class="dashboard-page management-page"><div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar('tipos-usuario')}"></aside><div class="app-main"><header th:replace="~{fragments/topbar :: topbar('Tipo de usuario', 'ADMINISTRACIÓN')}"></header>
<main class="content-area"><section class="page-intro"><h2 th:text="${modoEdicion} ? 'Editar tipo de usuario' : 'Registrar tipo de usuario'"></h2></section>
<section class="cliente-panel cliente-form-panel"><div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
<form method="post" th:action="${formAction}" th:object="${tipoUsuarioForm}" novalidate><div class="cliente-form-grid">
<div class="mb-3"><label for="nombre" class="form-label">Nombre *</label><input class="form-control" id="nombre" th:field="*{nombre}" maxlength="50" required><div class="field-error" th:errors="*{nombre}"></div></div>
<div class="mb-3"><label for="descripcion" class="form-label">Descripción *</label><textarea class="form-control" id="descripcion" th:field="*{descripcion}" maxlength="300" required></textarea><div class="field-error" th:errors="*{descripcion}"></div></div></div>
<div class="cliente-form-actions"><a class="btn btn-outline-secondary" th:href="@{/modulos/tipos-usuario}">Cancelar</a><button class="btn btn-success">Guardar tipo</button></div></form></section></main>
</div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/app.js}"></script></body></html>
