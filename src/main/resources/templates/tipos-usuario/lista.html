<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tipos de usuario | Sistema de Facturación Web')}"></head>
<body class="dashboard-page management-page"><div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar('tipos-usuario')}"></aside><div class="app-main">
<header th:replace="~{fragments/topbar :: topbar('Tipos de usuario', 'ADMINISTRACIÓN')}"></header>
<main class="content-area"><section class="page-intro"><p class="eyebrow">ADMINISTRACIÓN</p><h2>Gestión de tipos de usuario</h2><p>Organiza los tipos disponibles. El tipo administrativo reservado está protegido.</p></section>
<div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
<section class="cliente-panel"><div class="cliente-toolbar">
<form class="cliente-search" method="get" th:action="@{/modulos/tipos-usuario}"><label class="visually-hidden" for="buscar">Buscar tipos</label><input id="buscar" class="form-control" name="q" th:value="${filtro}" placeholder="Nombre o descripción"><button class="btn btn-outline-success">Buscar</button><a class="btn btn-outline-secondary" th:href="@{/modulos/tipos-usuario}">Limpiar</a></form>
<a class="btn btn-success cliente-create" th:href="@{/modulos/tipos-usuario/nuevo}">Registrar tipo</a></div>
<div class="table-responsive"><table class="management-table table invoice-table align-middle mb-0"><thead><tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Acciones</th></tr></thead><tbody>
<tr th:each="tipo : ${tipos}"><td th:text="${tipo.id}" data-label="ID"></td><td th:text="${#strings.trim(tipo.nombre)}" data-label="Nombre"></td><td th:text="${#strings.trim(tipo.descripcion)}" data-label="Descripción"></td><td class="cliente-actions" data-label="Acciones"><a class="btn btn-sm btn-outline-success" th:href="@{/modulos/tipos-usuario/{id}/editar(id=${tipo.id})}">Editar</a>
<form class="d-inline" method="post" th:action="@{/modulos/tipos-usuario/{id}/eliminar(id=${tipo.id})}" onsubmit="return confirm('¿Eliminar este tipo? No se eliminará si está reservado o tiene usuarios asociados.')"><button class="btn btn-sm btn-outline-danger">Eliminar</button></form></td></tr>
<tr th:if="${#lists.isEmpty(tipos)}"><td colspan="4" class="empty-invoices">No hay tipos que coincidan con la búsqueda.</td></tr></tbody></table></div></section></main>
</div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/app.js}"></script></body></html>
