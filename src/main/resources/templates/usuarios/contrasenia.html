<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Cambiar contraseña | Sistema de Facturación Web')}"></head>
<body class="dashboard-page management-page"><div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar('usuarios')}"></aside><div class="app-main"><header th:replace="~{fragments/topbar :: topbar('Cambiar contraseña', 'ADMINISTRACIÓN')}"></header>
<main class="content-area"><section class="page-intro"><h2>Cambiar contraseña</h2><p>Cuenta: <strong th:text="${#strings.trim(usuario.nombre)}"></strong></p></section>
<section class="cliente-panel cliente-form-panel"><div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
<form method="post" th:action="@{/modulos/usuarios/{id}/contrasenia(id=${usuario.id})}"><div class="cliente-form-grid">
<div class="mb-3"><label for="password" class="form-label">Nueva contraseña *</label><input id="password" class="form-control" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><div class="field-hint">Entre 12 y 128 caracteres. No se recortan espacios.</div></div>
<div class="mb-3"><label for="confirmation" class="form-label">Confirmar contraseña *</label><input id="confirmation" class="form-control" name="confirmation" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></div></div>
<div class="cliente-form-actions"><a class="btn btn-outline-secondary" th:href="@{/modulos/usuarios}">Cancelar</a><button class="btn btn-success">Cambiar contraseña</button></div></form></section></main>
</div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/app.js}"></script></body></html>
