<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Usuario | Sistema de Facturación Web')}"></head>
<body class="dashboard-page management-page"><div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar('usuarios')}"></aside><div class="app-main"><header th:replace="~{fragments/topbar :: topbar('Usuario', 'ADMINISTRACIÓN')}"></header>
<main class="content-area"><section class="page-intro"><h2 th:text="${modoEdicion} ? 'Editar usuario' : 'Registrar usuario'"></h2><p th:if="${modoEdicion}">El estado y la contraseña se cambian desde sus acciones independientes.</p></section>
<section class="cliente-panel cliente-form-panel"><div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div><div th:if="${#lists.isEmpty(tipos)}" class="alert alert-warning">Registra primero un tipo de usuario.</div>
<form method="post" th:action="${formAction}" th:object="${usuarioForm}" novalidate><div class="cliente-form-grid">
<div class="mb-3"><label for="nombre" class="form-label">Nombre de usuario *</label><input class="form-control" id="nombre" th:field="*{nombre}" maxlength="100" autocomplete="off" required><div class="field-error" th:errors="*{nombre}"></div></div>
<div class="mb-3"><label for="idTipo" class="form-label">Tipo de usuario *</label><select class="form-select" id="idTipo" th:field="*{idTipo}" required><option value="">Selecciona un tipo</option><option th:each="t : ${tipos}" th:value="${t.id}" th:text="${#strings.trim(t.nombre)}"></option></select><div class="field-error" th:errors="*{idTipo}"></div></div>
<th:block th:if="${!modoEdicion}"><div class="mb-3"><label for="password" class="form-label">Contraseña *</label><input class="form-control" id="password" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><div class="field-hint">Entre 12 y 128 caracteres. Se conservan los espacios.</div></div>
<div class="mb-3"><label for="confirmation" class="form-label">Confirmar contraseña *</label><input class="form-control" id="confirmation" name="confirmation" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></div>
<div class="mb-3 form-check"><input class="form-check-input" id="activo" type="checkbox" th:field="*{activo}"><label class="form-check-label" for="activo">Usuario activo</label></div></th:block></div>
<div class="cliente-form-actions"><a class="btn btn-outline-secondary" th:href="@{/modulos/usuarios}">Cancelar</a><button class="btn btn-success" th:disabled="${#lists.isEmpty(tipos)}">Guardar usuario</button></div></form></section></main>
</div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/app.js}"></script></body></html>
